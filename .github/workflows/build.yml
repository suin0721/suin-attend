name: 앱 만들기 (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk suin-attend.apk
          cp kakao/build/outputs/apk/debug/kakao-debug.apk suin-kakao.apk

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 수인T 출결 v1.${{ github.run_number }}
          body: |
            suin-attend.apk = 출결 앱, suin-kakao.apk = 카톡 보낼 함 앱. 폰에서 눌러 내려받아 설치하세요.
          make_latest: "true"
          files: |
            suin-attend.apk
            suin-kakao.apk
