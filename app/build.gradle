plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'kr.suin.attend'
    compileSdk 35

    defaultConfig {
        applicationId "kr.suin.attend"
        minSdk 26
        targetSdk 34
        // every GitHub build gets a higher number so the phone accepts it as an update
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // one fixed signing key for every build; a different key per build makes Android refuse the update
    signingConfigs {
        shared {
            storeFile file("suin.keystore")
            storePassword "suinattend"
            keyAlias "suin"
            keyPassword "suinattend"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
}
