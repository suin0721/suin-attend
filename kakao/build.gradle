plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.suin.kakao'
    compileSdk 35

    defaultConfig {
        applicationId "kr.suin.kakao"
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        shared {
            storeFile file("../app/suin.keystore")
            storePassword "suinattend"
            keyAlias "suin"
            keyPassword "suinattend"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared; minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
